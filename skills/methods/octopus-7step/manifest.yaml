name: vision-method-octopus-7step
version: 1.0.0
type: vision-method
displayName: "Octopus 7 步法"
description: "深潜完整版愿景构建（7 步骤 + T1-T10 模板 + AI 引导剧本），按构建转型愿景.md v2.1 落地；适合完整咨询项目阶段一"
steps:
  - id: "01"
    name: "界定转型问题与变革必要性"
    question: "为什么必须转型？当前业务价值实现卡在哪里？问题是否超出单纯系统建设范围？"
    operations:
      - "五类缺口检查（共同愿景/共同所有权/系统 vs 流程组织治理投资/变革管理/多学科交付）"
      - "采集 3-5 项量化绩效基线，记录与目标/对标差距"
      - "回答「为什么是现在」：市场/竞争/监管/技术触发因素 + 延后损失"
      - "问题严重度分级：生存级/竞争级/优化级"
      - "识别执行发起人与关键利益相关者"
    outputs:
      - "转型问题陈述"
      - "量化绩效基线表"
      - "紧迫性论证"
      - "问题分级清单"
      - "发起人与利益相关者清单"
    gate:
      coreCheck: "缺口判断均有数据或事实支撑（P1 证据先于判断）"
      pass: "必要性论证完整，发起人已具名"
      conditional: "部分数据缺失（如对标数据），登记未决项带项继续"
  - id: "02"
    name: "明确战略前提、关键取舍与转型边界"
    question: "转型为什么发生、服务谁、希望形成什么优势？哪些内容不属于本轮范围？"
    operations:
      - "区分三类输入：已确认战略/领导关注点/业务诉求"
      - "Choice Cascade 前三级：制胜抱负 → 竞争场域（明确不做什么）→ 制胜方式（级联表 T1）"
      - "信念假设清单：what would have to be true？（T2）"
      - "取舍裁决规则：冲突移交管理层，定义裁决机制"
      - "形成战略前提说明与转型边界（含本轮不做什么）"
    outputs:
      - "战略选择级联表"
      - "战略前提说明"
      - "信念假设清单"
      - "关键取舍与裁决记录"
      - "转型边界"
    gate:
      coreCheck: "级联表每层均有「不选什么」的显式记录（P1）"
      pass: "级联传导完整，取舍均有裁决记录"
      conditional: "个别信念假设无证据来源，登记未决项待验证"
  - id: "03"
    name: "拓展未来可能性并推导关键转型变化"
    question: "在不照搬外部案例的前提下，未来可能状态有哪些？企业需要发生什么变化？"
    operations:
      - "记录外部启发证据（业务结果/工作方式/绩效证据）并标注强度分级（T4）"
      - "识别 2 个关键不确定性 → 构建 2×2 情景矩阵，检验转型方向成立性（T3）"
      - "推导转型变化：目标业务结果 → 未来运营方式 → 关键能力 → 管理体系 → 技术使能"
      - "变化分类与回溯：战略必需/外部启发扩展/待验证假设，全部回溯战略前提"
    outputs:
      - "外部启发证据清单（含强度分级）"
      - "情景矩阵"
      - "战略前提—启发—变化对应表"
      - "AI 价值池候选"
    gate:
      coreCheck: "每项变化均可回溯到战略前提（P1）；外部启发仅拓展可能性不升行业标准"
      pass: "变化链完整可回溯，情景矩阵成立性判断清晰"
      conditional: "个别情景数据不足，登记未决项"
  - id: "04"
    name: "构建转型愿景"
    question: "如何将业务结果、运营变化、候选能力、管理体系与技术使能整合为共同理解的未来状态？这个未来状态为客户、员工、业务/组织创造什么结果与价值？"
    operations:
      - "归并 3-5 个未来状态主题"
      - "愿景共创工作坊（发起人+指导联盟+关键利益相关者，不少于 2 轮，顾问主持不代笔）"
      - "撰写一页未来某天的运营场景叙事稿"
      - "陈述愿景为客户、员工、业务/组织创造的结果与价值（对齐愿景口径：状态 + 价值 + 结果）"
      - "愿景质量自检（Kotter 六特质，T5）"
      - "取舍冲突检查（统一 vs 自主等）"
    outputs:
      - "总体转型愿景"
      - "愿景内涵"
      - "一页叙事稿"
      - "共创工作坊记录"
      - "质量自检表"
    gate:
      coreCheck: "愿景可想象（具体画面）且可沟通（5 分钟讲清）"
      pass: "六特质全部满足"
      conditional: "仅非核心特质（可取/可行/聚焦/灵活）未满足 ≤3 项，登记未决项"
  - id: "05"
    name: "确定转型雄心、变革范围与推进速度"
    question: "改变到什么程度？改变哪些业务与运营对象？以多快速度推进？"
    operations:
      - "转型光谱定位（系统替换 → 技术赋能业务转型，按流程/组织/数据多维度分别定位）"
      - "雄心量化表：3-5 项核心 KPI + 三年价值轨迹 + 责任人（T6）"
      - "速赢资金引擎：识别 no-regret moves 释放资金（T7）"
      - "组织与财务承受力评估（资金/人才/时间/管理注意力匹配）"
      - "AI 用例组合：先 lighthouse 后规模化排出时间轴"
    outputs:
      - "转型雄心草案及决策依据（深度/广度/规模/速度）"
      - "雄心量化表"
      - "速赢资金引擎清单"
      - "AI 用例组合时间轴"
    gate:
      coreCheck: "量化锚（量化表完整）与承受力论证成立"
      pass: "量化表完整且承受力论证成立"
      conditional: "部分 KPI 暂无法量化（待量化标记）或承受力数据缺失，登记未决项"
  - id: "06"
    name: "检验并完善转型愿景与雄心"
    question: "愿景与雄心是否具有战略一致性、未来状态完整性、变化必要性与商业价值基础？"
    operations:
      - "五项检验：长期战略一致性/高管共同承诺（条件性）/未来状态完整性/大胆紧迫可实现性/商业价值检验"
      - "验证计划表：每项价值假设指定验证方式/责任方/时间点（T8）"
      - "高管冲突处置：发起人沟通 → 权责再分配 → CEO 升级 → 激励挂钩"
      - "价值负责人指定（每项重大价值来源）"
    outputs:
      - "完善后的愿景与雄心"
      - "五项检验记录"
      - "验证计划表"
      - "争议与未决条件"
      - "价值负责人清单"
    gate:
      coreCheck: "长期战略一致性（删除技术名称仍有业务方向）与商业价值检验成立"
      pass: "五项检验全部通过或已修订完成"
      conditional: "检验问题修订不了（如高管承诺短期无法达成、价值假设暂无数据），登记未决项带项进入确认"
  - id: "07"
    name: "确认转型愿景与雄心"
    question: "愿景与雄心是否获得甲方正式确认并具备受控变更能力？"
    operations:
      - "未决项统一裁决：补充回答/降级为假设/移出范围，写入确认记录"
      - "确认会议 + exit criteria 判定（T9）：未决项裁决完成/利益相关者签署/资源承诺/变更控制生效"
      - "变更控制规则：触发条件/审批人/修订流程"
      - "输出下游接口：能力路线图/Benefit Case/愿景沟通策略草案"
    outputs:
      - "经确认的愿景/雄心/深度/广度/规模/速度"
      - "确认记录与 exit criteria 判定"
      - "未决项裁决记录"
      - "变更控制规则"
      - "下游接口（含沟通策略草案）"
    gate:
      coreCheck: "exit criteria 通过：未决项无一无主 + 关键利益相关者签署"
      pass: "全部判定项通过，甲方确认"
      conditional: "有条件通过：附未决项裁决结果与遗留清单"
aiConstraints:
  - "不从模型、工具或孤立用例推导转型目标——AI 目标须从端到端流程价值池出发"
  - "AI 嵌入引导与记录，不替代顾问决策；gate 判定结果仅作建议，最终授权由顾问确认后写入"
  - "AI 不设独立主链——AI 内容嵌入各步骤，不形成独立 AI 检查/推导流程"
  - "引用层级纪律——只引用顾问确认环节达成的共识，访谈/资料降级为背景材料"
outputContract:
  requires:
    - "visionStatement"
    - "ambitionTable"
    - "ambitionRationale"
    - "impactSummary"
  optional:
    - "visionNarrative"
    - "validationPlan"
    - "changeControl"
    - "aiElements"
