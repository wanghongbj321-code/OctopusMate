# 构建企业能力路线图方法 manifest（对齐方法论 v1.2 六步骤与 §4.2 输出契约）
name: roadmap-method-capability
version: 1.0.0
type: roadmap-method
displayName: "构建企业能力路线图"
description: "将愿景与雄心转化为战略对齐的企业能力模型、成熟度基线、重点能力、差距举措与企业级路线图（六阶段：01 能力模型 → 02 基线与成熟度 → 03 重点能力 → 04 未来状态与差距 → 05 差距举措 → 06 企业级路线图），交付资产包（index + 六页）"
fileGate: true   # 文件级规则型 gate（G0/G7）：六阶段 confirmed md + confirmation 元数据 + hash + required artifacts + stale 校验（M4 接入 roadmap adapter）

steps:
  - id: "01"
    name: "构建战略对齐的企业能力模型"
    question: "实现已确认方向、最终业务结果和中间收益，需要哪些完整企业能力？（从价值与能力连接出发，识别能力集群与单项能力，定义 Mission/Purpose，进行战略性质分类并纳入 AI 对象，执行建模规范检查与价值流校验）"
    operations:
      - "建立企业价值与能力连接（T1：愿景→业务结果→中间收益→使能条件→能力→Mission→Benefit Case 接口）"
      - "识别完整单项能力（组织运营 / 战略交付 / 竞争优势所需），构造能力集群（按职能/部门/流程/端到端流程共同分母聚合）"
      - "定义每项能力 Mission 和 Purpose；进行战略性质分类（Strategic / Foundational / Core）并保留分类理由（T2）"
      - "纳入 AI 对象（业务 AI 用例组合、共同 AI 能力候选、治理与运营能力候选）作为能力识别输入"
      - "执行建模规范检查（T2A：命名/层级/MECE/粒度/稳定性/版本治理）"
      - "执行价值流校验（T2B：关键价值流/客户结果/利益相关方结果检查能力遗漏、重叠与战略偏差）"
    outputs:
      - "价值-能力连接（T1）"
      - "能力模型清单（T2，含 L1/L2、Mission、价值来源、AI 依赖、分类、owner、版本）"
      - "建模规范检查结果（T2A）"
      - "价值流校验记录（T2B）"
    gate:
      coreCheck: "能力模型完整性 / 战略对齐——能力模型覆盖组织运营、战略交付和竞争优势所需能力，且每项能力可回溯愿景、雄心或价值假设；能力命名、层级、MECE、粒度和版本治理满足建模规范"
      pass: "能力模型完整且对齐愿景/雄心/价值假设，建模规范检查与价值流校验通过"
      conditional: "部分能力 Mission、Purpose、分类理由、价值流校验或建模证据不足 → 登记未决项，可进入步骤 02"
      # 回指触发：能力模型只是一组部门项目、流程清单或 AI 用例清单，无法支撑后续成熟度和优先级判断

  - id: "02"
    name: "建立能力基线并评估成熟度"
    question: "每项能力当前处于什么状态？相对基本要求和市场基准处于什么成熟度？（六维当前状态基线 + 独立基准 + 成熟度判断 + 证据强度与校准）"
    operations:
      - "建立六维当前状态基线（T3：Mission / Insights / Process / Technology / Talent / Governance；能力域集合来自阶段 01 confirmed 能力模型）"
      - "独立形成基本要求和市场基准（T4：强制要求 / 正常专业要求 / 同行基准 / 普遍实践 / 领先实践），不受本企业愿景预先筛选"
      - "判断单项能力成熟度（T5：以 Mission、六维基线和独立市场基准为依据 → Lagging / Performing / Leading）；综合成熟度基于整体判断，不设加权评分公式（规则 4）"
      - "判断能力域整体成熟度（基于域内单项能力成熟度形成或重新评估）"
      - "记录证据说明与证据强度（T5A：A/B/C），记录冲突证据和后续验证方式"
      - "进行成熟度校准（跨能力检查 Lagging/Performing/Leading 判定口径，避免标准漂移）"
    outputs:
      - "六维当前状态基线（T3）"
      - "基本要求与市场基准表（T4，含适用性说明）"
      - "成熟度判断表（T5，含综合成熟度口径）"
      - "证据强度与校准表（T5A）"
    gate:
      coreCheck: "基线证据 / 基准独立性——当前状态、市场基准和成熟度判断边界清晰，成熟度有 A/B 级证据支撑，且已完成跨能力口径校准"
      pass: "六维基线完整、基准独立形成、成熟度有 A/B 级证据且已完成校准"
      conditional: "部分事实、外部基准或校准证据缺失 → 标注证据强度和未决项，可进入步骤 03"
      # 回指触发：以领导偏好、单个案例或部门印象替代基准，或将成熟度直接用于重点能力排序

  - id: "03"
    name: "确定重点能力"
    question: "哪些能力对总体方向最关键，且应由谁承担业务所有权？（双视角判断合并 + 条件重点能力机制 + 业务所有权与治理角色 + 价值流校验）"
    operations:
      - "企业能力模型视角判断（对总体方向、愿景、雄心和价值实现最关键的能力域与具体能力）+ 能力域内部视角判断（域内构成关键差距的单项能力）→ 合并形成企业级重点能力清单"
      - "明确业务所有权（为重点能力集群或单项能力指定业务所有者）；记录治理角色关系（T6：Capability / Business Process / Technology / Data / Change / Portfolio Governance）"
      - "记录判断依据（战略关联、价值贡献、成熟度信息、组织承载、必要补充诊断证据）"
      - "执行价值流与客户结果校验（T2B 复核：是否支撑关键价值流、客户结果、监管要求或重要利益相关方结果）"
      - "条件重点能力机制：战略关键性证据不足（关键数据缺失 / 跨角色裁决未完成 / 证据强度 C 级）时登记为条件重点能力，挂未决项（T12），明确责任人、拟裁决方式与时限"
      - "记录非重点能力的排除理由（防'成熟度最低项'与'部门诉求'误区，供步骤 04/05 复核）"
    outputs:
      - "重点能力判断表（T6，含双视角依据 + 价值流校验 + 治理角色）"
      - "企业级重点能力清单（含条件重点能力及裁决安排）"
      - "非重点能力排除理由记录"
    gate:
      coreCheck: "战略关键性 / 业务所有权——重点能力可回溯愿景、雄心、价值实现和关键价值流，并已明确业务所有权及必要治理角色"
      pass: "重点能力战略回溯完整、业务所有权与治理角色明确，非重点排除理由齐备"
      conditional: "局部证据、价值流校验或所有权待确认 → 登记未决项（条件重点能力挂 T12 裁决安排），可进入步骤 04"
      # 回指触发：简单选择成熟度最低能力、部门诉求项目或市场标杆热点作为重点能力

  - id: "04"
    name: "设计重点能力未来状态并识别差距"
    question: "重点能力未来应达到什么状态？当前与未来之间的差距是什么？（六维未来状态 + 差距分级 + AI 十三项规模化条件 + AI 风险与可信控制）"
    operations:
      - "设计六维未来状态（T7：围绕重点能力 Mission 和价值贡献设计 Mission/Insights/Process/Technology/Talent/Governance 未来状态），标注未来要求来源（战略/愿景/标准/标杆/启发/风险/设计判断）"
      - "比较当前与未来 → 形成六维差距，标注差距级别（大/中/小）与差距画像（整体判断，不设加权评分公式，规则 4）"
      - "检查 AI 规模化条件（T8：AI 十三项规模化条件检查六维完整性，不拆独立步骤）"
      - "分层描述数据要求（近期用例数据 / 跨用例共同数据及数据管道 / 长期数据现代化）"
      - "标注风险与适用性（T8A：高风险/强监管/客户影响大/依赖外部基准的未来要求记录适用性和风险边界）"
      - "明确 AI 生命周期控制（设计、验证、上线、监控、退役阶段的治理要求）"
    outputs:
      - "六维未来状态与差距表（T7，含差距级别与差距画像）"
      - "AI 规模化条件检查表（T8）"
      - "AI 风险与可信控制映射表（T8A，含风险等级/可信特征/生命周期检查点）"
    gate:
      coreCheck: "未来状态可回溯 / 差距可解释——未来状态与愿景、雄心和能力 Mission 对齐，差距可由当前基线解释"
      pass: "六维未来状态与差距完整、可回溯可解释，AI 风险控制字段齐备"
      conditional: "部分未来要求来源待补证或组织承受力待确认 → 登记未决项，可进入步骤 05"
      # 回指触发：直接把市场领先实践等同于本企业目标，或未来状态脱离愿景、雄心与能力 Mission

  - id: "05"
    name: "识别并排序能力差距举措"
    question: "需要哪些举措弥合重点能力差距？单项能力内部应如何排序？（举措映射 + 域内排序 + 技术举措前置检查 + AI 分层 + 取舍依据）"
    operations:
      - "按差距识别举措：针对每项重点能力的六维差距识别弥合举措；建立举措映射（T9：举措与能力、六维差距、愿景、价值、证据、标杆适用性、依赖、责任、验证方式）"
      - "单项能力内部排序：在单项能力内部完成排序，形成可被企业级路线图整合的输入"
      - "检查技术举措前置条件（T9B：技术举措必须同步检查 Insights/Talent/Process/Governance 是否需提前或并行弥合，防'只建系统不建能力'）"
      - "分层识别 AI 举措（用例专属 / 共同模型数据平台工程 / 治理运营 / 近期数据准备 / 共同数据基础 / 长期数据现代化 / 可信 AI）"
      - "记录举措取舍依据（T9A：战略必要性 / 价值确定性 / 依赖关键性 / 风险暴露 / 组织承受力 / 学习价值）"
    outputs:
      - "能力差距举措表（T9，含六维映射 + 验证方式 + 域内排序）"
      - "跨能力取舍记录表（T9A）"
      - "技术举措前置条件检查表（T9B）"
    gate:
      coreCheck: "差距回溯 / 依赖可见——每项举措均可回溯到能力差距和价值关系，并记录依赖、责任、验证方式和取舍依据"
      pass: "举措-差距-价值-依赖-验证-取舍六维映射齐备，技术举措前置检查表必填完成"
      conditional: "成本、复杂度或验证方式待补 → 登记未决项，可进入步骤 06"
      # 回指触发：举措只是项目清单、系统建设清单或 AI 用例清单，不能说明弥合哪项能力差距

  - id: "06"
    name: "形成企业级能力路线图"
    question: "如何将各重点能力内部举措整合为支撑转型愿景和雄心的企业级能力路线图？（跨能力排序 + 三阶段 + 里程碑 M/G/D + 度量复审 + 四层一致性 + 下游接口摘要）"
    operations:
      - "跨能力汇总：汇总各重点能力产生的全部举措，合并重复或高度耦合举措；跨能力排序：结合愿景、雄心、价值、资源、依赖、风险、学习价值和承受力形成企业级优先顺序"
      - "保留依赖关系：明确前置、并行和跨能力依赖（特别是基础能力与早期影响之间的并行关系）"
      - "分阶段组织多年路线图（T10：三阶段目标、举措重心、资源和能力建设投资）；以排序簇聚合表达取舍全貌"
      - "纳入持续治理（T11：组合协调、取舍上报、进展跟踪、风险依赖管理、动态复审和重新排序要求）"
      - "定义成果度量（T11A：每阶段业务结果/能力/采用行为/风险/价值验证指标，含口径、数据源、owner、统计频率、复审节奏与触发器）"
      - "检查四层一致性（T11B：Strategy / Business Model / Operating Model / Enabling Technology and Infrastructure）"
      - "定义复审触发器（战略、资源、监管、价值假设、重大依赖、架构风险或 AI 风险事件触发）；输出下游接口摘要（O7：端到端方案 / 目标运营模式 / 详细实施计划 / Benefit Case / 企业架构 / 组合治理，允许明确写不适用或待补但不可缺失）"
    outputs:
      - "企业级能力路线图表（T10，含排序簇 + 三阶段目标 + 资源与投资）"
      - "路线图依赖与治理清单（T11）+ 度量与复审表（T11A）+ 四层一致性检查表（T11B）"
      - "下游接口摘要（O7）"
    gate:
      coreCheck: "路线图完整性 / 依赖与资源可承受——路线图覆盖实现愿景和雄心所需关键举措，保留依赖、阶段目标、资源、取舍依据、成果度量、复审触发器与治理要求"
      pass: "排序簇齐备、里程碑 M/G/D 结构完整、四层一致性结论与下游接口摘要必填"
      conditional: "局部资源、成本或治理安排待确认 → 登记未决项，带入阶段成果确认或下游验证"
      # 回指触发：路线图只是项目时间表，或资源、依赖、治理明显不可承受且未调整举措排序、未来状态或雄心速度

aiConstraints:                  # 方法级 AI 约束（平台 AI 铁律不可降级，只能追加）
  - "每阶段产物 AI 只提供草稿，必须用户明确确认（confirmation 元数据 confirmed_by=user + interaction_ref + hash）才可进入下一步；AI 不得虚构用户选择、自选默认值"
  - "不新增评分权重、成熟度公式、依赖算法、投资组合模型或阶段门计算规则（方法论 v1.2 规则 4/5）；所有跨能力排序、延后、移出和资源冲突裁决必须保留非公式化取舍依据"
  - "引用层级纪律：只引用顾问确认环节达成的共识与经核验证据，访谈/资料降级为背景材料；证据强度 A/B/C 必须标注，证据缺口进入未决项"
  - "AI 嵌入主方法不形成独立 AI 主链：AI 用例、共同 AI 能力、治理运营、数据与模型基础、可信控制嵌入能力与路线图，不作为第七个维度或独立路线图"
  - "可视化图形数据全部来自六阶段 confirmed md 的结构化数据块，禁止引用 demo 样例数值（Illustrative 演示数据不得泄漏进交付物）"
  - "量化指标必须标注「Illustrative · 需实际调研校准」；业务数据只来自 confirmed md，不凭空生成"

outputContract:                 # 声明本方法覆盖的输出契约字段（§4.2：核心字段七项必填，保证资产包六页均有数据源 + O7 接口有明确裁决）
  requires:
    - capabilityModel        # O1 战略对齐的企业能力模型（L1/L2 能力、Mission、Strategic/Core/Foundational 分类、建模规范检查、价值流校验）
    - maturityBaseline       # O2 能力基线与成熟度（六维当前状态基线、基本要求与市场基准、成熟度、证据强度、校准）
    - priorityCapabilities   # O3 企业级重点能力（双视角判断、条件重点、所有权与治理角色、非重点排除理由）
    - futureStateGaps        # O4 未来状态与差距（六维未来状态、差距分级、AI 十三项条件、风险与可信控制）
    - gapInitiatives         # O5 能力差距举措（举措映射、域内排序、技术举措前置检查、AI 分层、取舍依据）
    - enterpriseRoadmap      # O6 企业级能力路线图（排序簇、三阶段目标、里程碑 M/G/D、度量复审、四层一致性）
    - downstreamInterfaces   # O7 下游接口摘要（端到端方案 / 目标运营模式 / 详细实施计划 / Benefit Case / 企业架构 / 组合治理；允许明确写不适用/待补但不可缺失）
  optional:
    - openIssues             # 未决条件清单（六阶段累积 + 跨阶段继承，T12）
    - aiElements             # AI 嵌入状态描述
    - changeControl          # 变更控制规则
